<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f3f4f6">
  <title>Interactive Calculator</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="page">
    <section class="calculator" aria-label="Calculator">
      <header class="calculator-header">
        <div>
          <h1>Calculator</h1>
        </div>
        <span class="calculator-icon" aria-hidden="true">＋</span>
      </header>

      <div class="display" aria-live="polite" aria-atomic="true">
        <div class="display-expression" id="expression"></div>
        <output class="display-value" id="display" aria-label="Display">0</output>
      </div>

      <div class="keypad" id="keypad" aria-label="Calculator keypad">
        <button class="key key-function" type="button" data-action="clear" aria-label="All clear">AC</button>
        <button class="key key-function" type="button" data-action="delete" aria-label="Backspace, delete last digit">⌫</button>
        <button class="key key-function" type="button" data-action="sign" aria-label="Change sign">+/−</button>
        <button class="key key-operator" type="button" data-operator="/" aria-label="Divide">÷</button>

        <button class="key" type="button" data-digit="7">7</button>
        <button class="key" type="button" data-digit="8">8</button>
        <button class="key" type="button" data-digit="9">9</button>
        <button class="key key-operator" type="button" data-operator="*" aria-label="Multiply">×</button>

        <button class="key" type="button" data-digit="4">4</button>
        <button class="key" type="button" data-digit="5">5</button>
        <button class="key" type="button" data-digit="6">6</button>
        <button class="key key-operator" type="button" data-operator="-" aria-label="Subtract">−</button>

        <button class="key" type="button" data-digit="1">1</button>
        <button class="key" type="button" data-digit="2">2</button>
        <button class="key" type="button" data-digit="3">3</button>
        <button class="key key-operator" type="button" data-operator="+" aria-label="Add">+</button>

        <button class="key key-function" type="button" data-action="percent" aria-label="Percent">%</button>
        <button class="key" type="button" data-digit="0">0</button>
        <button class="key" type="button" data-action="decimal" aria-label="Decimal point">.</button>
        <button class="key key-equals" type="button" data-action="equals" aria-label="Equals">=</button>
      </div>
      <p class="keyboard-hint">You can also use your keyboard</p>
    </section>
  </main>
</body>
</html>
